name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore server
        run: |
          dotnet restore AVI-Meals.Server/AVI-Meals.Server.csproj
          dotnet restore AVI-Meals.Server.Tests/AVI-Meals.Server.Tests.csproj

      - name: Install client dependencies
        working-directory: avi-meals.client
        run: npm ci

      - name: Verify server formatting
        run: dotnet format AVI-Meals.Server/AVI-Meals.Server.csproj --no-restore --verify-no-changes --verbosity diagnostic
        env:
          CI: true
          BuildingInsideDocker: true

      - name: Verify client formatting
        working-directory: avi-meals.client
        run: npm run format

      - name: Ensure formatting produced no local changes
        run: git diff --exit-code

      - name: Run client lint
        working-directory: avi-meals.client
        run: npm run lint

      - name: Test server
        run: dotnet test AVI-Meals.Server.Tests/AVI-Meals.Server.Tests.csproj --configuration Release --no-restore
        env:
          CI: true
          BuildingInsideDocker: true

      - name: Build client
        working-directory: avi-meals.client
        run: npm run build

      - name: Test client
        working-directory: avi-meals.client
        run: npm run test:run
