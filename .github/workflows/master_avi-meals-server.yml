# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - AVI-Meals-Server

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  CI: true
  BuildingInsideDocker: true
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore AVI-Meals.Server/AVI-Meals.Server.csproj

      - name: Build with dotnet
        run: dotnet build AVI-Meals.Server/AVI-Meals.Server.csproj --configuration Release --no-restore
        env:
          CI: true
          BuildingInsideDocker: true

      - name: Publish
        run: dotnet publish AVI-Meals.Server/AVI-Meals.Server.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp" --no-restore
        env:
          CI: true
          BuildingInsideDocker: true

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FEDE99B3543044B8AB2B3FB16F2B605A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B492564EC9F44268BA329D57E306BC1A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_983CA3DBE6014B70833142AA9BABF3B3 }}

      - name: Configure App Service settings
        uses: azure/cli@v2
        with:
          inlineScript: |
            RG="$(az webapp list --query "[?name=='AVI-Meals-Server'].resourceGroup | [0]" -o tsv)"
            az webapp config appsettings set \
              --resource-group "$RG" \
              --name AVI-Meals-Server \
              --settings \
                ASPNETCORE_ENVIRONMENT=Production \
                Cors__AllowedOrigins__0=https://jrscott812.github.io \
              --output none
            az webapp config set \
              --resource-group "$RG" \
              --name AVI-Meals-Server \
              --always-on true \
              --ftps-state Disabled \
              --output none
            az webapp config set \
              --resource-group "$RG" \
              --name AVI-Meals-Server \
              --generic-configurations "{\"healthCheckPath\":\"/health\"}" \
              --output none || echo "healthCheckPath update skipped"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'AVI-Meals-Server'
          slot-name: 'Production'
          package: .

      - name: Verify health endpoint
        shell: pwsh
        run: |
          $url = "https://avi-meals-server.azurewebsites.net/health"
          $ok = $false
          for ($i = 1; $i -le 12; $i++) {
            try {
              $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 30
              if ($response.StatusCode -eq 200 -and $response.Content -match '"status"\s*:\s*"ok"') {
                Write-Host "Health check passed on attempt $i"
                $ok = $true
                break
              }
            } catch {
              Write-Host "Attempt $i failed: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 5
          }
          if (-not $ok) { throw "Azure /health did not return ok after deploy." }
